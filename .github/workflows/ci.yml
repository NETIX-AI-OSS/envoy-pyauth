name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: build-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Test
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy --config-file pyproject.toml
      - name: Audit runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --output-file requirements-audit.txt
          # uv export is fully pinned; audit those exact locked versions.
          uv run pip-audit --disable-pip --no-deps --requirement requirements-audit.txt
