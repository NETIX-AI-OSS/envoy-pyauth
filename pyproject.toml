[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# Explicit package list: a stray root __init__.py otherwise breaks setuptools' automatic
# flat-layout discovery, producing a wheel that silently omits the envoy_pyauth submodules
# (e.g. permissions.py). Keep this in sync when adding top-level packages.
[tool.setuptools]
packages = ["envoy_pyauth"]

[project]
name = "envoy-pyauth"
description = "Envoy Python Authentication Library"
readme = "README.md"
requires-python = ">=3.14,<4.0"
keywords = ["envoy", "python", "authentication"]
license = {text = "AGPL-3.0-only"}
classifiers = [
    "Framework :: Django",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Django>=5.2.12,!=6.0.0,!=6.0.1,!=6.0.2",
    "djangorestframework>=3.15.2",
    "requests>=2.32.3",
    # __init__.py calls django_stubs_ext.monkeypatch() at import time, so it must be a
    # runtime (not dev-only) dependency or every consumer venv without it fails to import.
    "django-stubs-ext>=5.1.0"
]
version = "1.5.0"

[tool.black]
line-length = 120

[dependency-groups]
dev = [
    "black>=26.1.0",
    "django-stubs>=5.2.0",
    "mypy>=1.13",
    "pre-commit>=4.5.0",
    "ruff>=0.9.10",
]


# [project.scripts]
# my-script = "my_package.module:function"

# ... other project metadata fields as specified in:
#     https://packaging.python.org/en/latest/specifications/declaring-project-metadata/

[tool.mypy]
python_version = "3.14"
files = ["envoy_pyauth"]
explicit_package_bases = true
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "envoy_pyauth.mypy_settings"

[tool.pyright]
venvPath = "."
venv = ".venv"
