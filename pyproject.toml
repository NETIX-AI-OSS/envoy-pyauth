[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# Root __init__.py breaks flat-layout discovery; list packages here.
[tool.setuptools]
packages = ["envoy_pyauth"]

[project]
name = "envoy-pyauth"
description = "Envoy Python Authentication Library"
readme = "README.md"
requires-python = ">=3.14,<4.0"
keywords = ["envoy", "python", "authentication"]
license = "AGPL-3.0-only"
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Django>=5.2.12,!=6.0.0,!=6.0.1,!=6.0.2",
    "djangorestframework>=3.15.2",
    "requests>=2.32.3",
    # django-stubs-ext must be a runtime dep: __init__.py imports it eagerly.
    "django-stubs-ext>=5.1.0"
]
version = "2.0.0"

[tool.black]
line-length = 120
target-version = ["py314"]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "django-stubs>=5.2.0",
    "mypy>=1.13",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.0",
    "ruff>=0.9.10",
]


# [project.scripts]
# my-script = "my_package.module:function"

# ... other project metadata fields as specified in:
#     https://packaging.python.org/en/latest/specifications/declaring-project-metadata/

[tool.mypy]
python_version = "3.14"
files = ["envoy_pyauth"]
explicit_package_bases = true
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "envoy_pyauth.mypy_settings"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
# Hyphenated checkout dir: Ruff flags valid imports as bad module names.
ignore = ["N999"]
